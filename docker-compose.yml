services:
  mysql:
    image: mysql:8.0
    container_name: coupon_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: coupon_db
    ports:
      - "3306:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  app1:
    build: .
    container_name: coupon_app_1
    restart: always
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: coupon_db
      DB_CONNECTION_LIMIT: 20
    depends_on:
      mysql:
        condition: service_healthy

  app2:
    build: .
    container_name: coupon_app_2
    restart: always
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: coupon_db
      DB_CONNECTION_LIMIT: 20
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
